name: Backend and contracts
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      TEST_POSTGRES_URL: postgresql://postgres:test-only-password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}  # gitleaks scans the pull request's commit range, which a shallow clone lacks
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip, cache-dependency-path: services/api/requirements.lock.txt}
      - run: pip install -r services/api/requirements.lock.txt
      - run: ruff check services/api data-ingestion scripts
      - run: pytest -q --cov=app --cov-report=term-missing
      - run: python scripts/export_openapi.py
      - uses: pnpm/action-setup@v4
        with: {version: 11}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate:types && pnpm typecheck
      - run: git diff --exit-code -- docs/openapi.json packages/api-client/schema.d.ts
      - run: pip install pip-audit && pip-audit -r services/api/requirements.lock.txt
      - uses: gitleaks/gitleaks-action@v2
        env: {GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
