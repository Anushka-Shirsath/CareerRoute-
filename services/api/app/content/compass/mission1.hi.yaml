    {
      "id": "S1",
      "type": "choice",
      "text": "Your school's Innovation Festival is in 4 days. Your team needs you. What do you grab first?",
      "options": [
        {
          "id": "S1.a",
          "text": "The toolbox. Someone has to build the model.",
          "tags": {
            "PM": 1
          }
        },
        {
          "id": "S1.b",
          "text": "The budget sheet. Let us see what we can afford.",
          "tags": {
            "EN": 1
          }
        },
        {
          "id": "S1.c",
          "text": "Sketch paper. The stall has to look amazing.",
          "tags": {
            "CR": 1
          }
        },
        {
          "id": "S1.d",
          "text": "The team list. I will make sure everyone knows their job.",
          "tags": {
            "SO": 1
          }
        },
        {
          "id": "S1.e",
          "text": "The judging rules. Let us find out what they score.",
          "tags": {
            "AN": 1
          }
        }
