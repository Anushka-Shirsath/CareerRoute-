          "text": "Test each part one by one until I find the fault.",
          "tags": {
            "AN": 1
          }
        },
        {
          "id": "S2.b",
          "text": "Rebuild it fast with spare parts.",
          "tags": {
            "PM": 1
          }
        },
        {
          "id": "S2.c",
          "text": "Switch to a poster and short video that shows the idea.",
          "tags": {
            "CR": 1
          }
        },
        {
          "id": "S2.d",
          "text": "Calm the team and split the fixing work.",
          "tags": {
            "SO": 1
          }
        },
        {
          "id": "S2.e",
          "text": "Decide what we can drop and still have a good stall.",
          "tags": {
            "EN": 1
          }
        }
      ]
    },
    {
      "id": "S3",
      "type": "choice",
      "text": "Supplies cost ₹600 more than your budget.",
